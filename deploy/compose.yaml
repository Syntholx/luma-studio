name: luma-demo

services:
  api:
    image: luma-demo-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      AllowedHosts: luma.szymon-michalek.dev;luma-web;localhost
      Orders__DatabasePath: /var/lib/luma-orders/orders.db
      Orders__KnownProxy: 172.30.22.2
    volumes:
      - order-data:/var/lib/luma-orders
    networks:
      backend:
        ipv4_address: 172.30.22.3
        aliases: [luma-catalog-api]
    restart: unless-stopped
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}

  web:
    image: luma-demo-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    networks:
      backend:
        ipv4_address: 172.30.22.2
      edge:
        aliases: [luma-web]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    # No ports: only the existing HTTPS gateway exposes public ports.

networks:
  backend:
    internal: true
    ipam:
      config: [{subnet: 172.30.22.0/24}]
  edge:
    external: true
    name: tsm-demo_proxy

volumes:
  order-data:
